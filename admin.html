<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Rye&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração de Convidados - Churrasco do Sucegan 🤠</title>
</head>
<body>
  <main class="container">
    <header>
      <h1>Gestão de Convidados 👨‍💼</h1>
    </header>

    <section id="loginSection" class="card">
      <h2>Acesso Restrito</h2>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="password" id="adminPasswordInput" placeholder="Digite a senha">
        <button id="loginButton" class="small-button" style="width: auto;">Entrar</button>
      </div>
      <p id="loginError" class="error-msg hidden">Senha incorreta!</p>
    </section>

    <section id="adminContent" class="card hidden">
      <div class="admin-controls">
        <button id="refreshButton" type="button" class="small-button">Atualizar</button>
        <button id="exportButton" type="button" class="small-button">Exportar CSV</button>
        <button id="logoutButton" type="button" class="small-button danger">Sair</button>
      </div>
      
      <div class="admin-summary" style="margin: 15px 0; display: flex; flex-direction: column; gap: 5px;">
        <span>Total de registros (formulários): <strong id="guestCountDisplay">0</strong></span>
        <span>Total geral de pessoas (com acompanhantes): <strong id="totalPeopleDisplay">0</strong></span>
      </div>
      
      <input id="guestSearch" type="text" placeholder="Buscar por nome...">
      <ul id="adminGuestList" class="attendance-list"></ul>
      
      <p id="adminMessage" class="hidden"></p>
    </section>

    <section class="card admin-link-card">
      <a class="link-button link-button-faint" href="index.html">Voltar</a>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
